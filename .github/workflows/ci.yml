name: CI
on:
  pull_request:
  push:
    branches: [main, 'claude/**']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      REQUIRE_PG: '1'          # a missing database FAILS the run: the isolation tests must never be skipped in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:hosted
      - run: npm run scan:secrets
      - run: npm run audit:prod
      - name: Browser tests (real browser, mocked identity provider and AI)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Production bundle starts and refuses unsafe configuration
        run: |
          ! APP_MODE=hosted node dist-server/main.mjs 2>err.txt; grep -q DATABASE_URL err.txt
          ! HOST=0.0.0.0 NODE_ENV=production node dist-server/main.mjs 2>err2.txt; grep -q "no login" err2.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/ }
