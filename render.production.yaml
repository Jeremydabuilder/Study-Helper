# Render Blueprint for the PRODUCTION pilot only. Do not create it until docs/LAUNCH_CHECKLIST.md has no open blockers. Creates ONE web service, ONE disk and ONE database.
# autoDeploy is off; secrets (sync: false) are entered in the Render dashboard. Validate first:  render blueprints validate render.production.yaml
# Create it from the dashboard with "Blueprint file path" = render.production.yaml. One instance only (student files live on the service's disk).
# UNVERIFIED against Render's current documentation: see docs/DEPLOYMENT.md "Before the first sync".
services:
  - type: web
    name: study-helper-pilot
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build:hosted && npm run prune:prod
    startCommand: npm run start:hosted
    healthCheckPath: /readyz
    numInstances: 1                                   # student files live on this service's disk: never more than one
    disk: { name: pilot-data, mountPath: /var/data, sizeGB: 5 }
    envVars:
      - { key: NODE_VERSION, value: "22.13.0" }
      - { key: APP_ENV, value: production }
      - { key: DATA_LABEL, value: production }
      - { key: DATA_DIR, value: /var/data }
      - { key: DATABASE_URL, fromDatabase: { name: study-helper-pilot-db, property: connectionString } }
      - { key: PUBLIC_URL, sync: false }               # optional: defaults to this service's own https://….onrender.com address; set it if you add a custom domain
      - { key: BETTER_AUTH_SECRET, generateValue: true }
      - { key: APP_SECRET, generateValue: true }
      - { key: OPERATOR_TOKEN, generateValue: true }
      - { key: OPERATOR_NAME, sync: false }            # required: shown in the privacy notice
      - { key: OPERATOR_CONTACT, sync: false }         # required: how students reach you
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: LIMIT_USER_DAILY_AI_REQUESTS, value: "60" }
      - { key: LIMIT_USER_DAILY_USD, value: "0.30" }
      - { key: LIMIT_GLOBAL_DAILY_USD, value: "5" }    # your hard daily ceiling for the whole pilot: raise it only on purpose
databases:
  - { name: study-helper-pilot-db, plan: basic-256mb, region: oregon, databaseName: study_helper_pilot, user: study_helper, ipAllowList: [] }
